                    fontFamily: {
                        display: ["Inter", "sans-serif"],

                        DEFAULT: "0.5rem",

                        xl: "1.5rem",
                        "2xl": "2rem",

    <style>
        .orb {
            transform: translateZ(0);
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #050505;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .glass-panel {
            background: rgba(16, 16, 25, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .text-gradient {
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* CRT Scanline Overlay */
        .crt-scanlines::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),

            z-index: 20;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- ISHKAR SINGH LOGO --- */
        .logo-shimmer-container {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .logo-shimmer-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent 25%,
                    rgba(255, 255, 255, 0.15) 35%,
                    rgba(255, 255, 255, 0.55) 43%,
                    rgba(255, 255, 255, 0.3) 48%,
                    transparent 52%,
                    rgba(255, 255, 255, 0.45) 57%,
                    rgba(255, 255, 255, 0.1) 64%,
                    transparent 72%);
            pointer-events: none;
            z-index: 20;
            -webkit-user-select: none;
            user-select: none;
            mix-blend-mode: overlay;
            -webkit-mask-image: url("./assets/images/DPText.png");
            mask-image: url("./assets/images/DPText.png");
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            animation: multiShimmerSweep 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes multiShimmerSweep {
            0% {
                left: -150%;
            }

            100% {
                left: 150%;
            }
        }

        .hover-glow-primary:hover {
            box-shadow: 0 0 20px rgba(11, 11, 217, 0.4);
            border-color: rgba(11, 11, 217, 0.5) !important;
        }

        /* --- SKULL PATROL ANIMATIONS --- */
        @keyframes patrolMoveWide {

            0%,
            100% {
                transform: translateX(-160px);
            }

            50% {
                transform: translateX(160px);
            }
        }

        @keyframes skullFlipWide {

            0%,
            49.9% {
                transform: scaleX(1);
            }

            50%,
            99.9% {
                transform: scaleX(-1);
            }
        }

        .animate-patrol-wide {
            animation: patrolMoveWide 8s ease-in-out infinite;
        }

        .animate-skull-flip-wide {
            animation: skullFlipWide 8s step-end infinite;
        }
    </style>
</head>
